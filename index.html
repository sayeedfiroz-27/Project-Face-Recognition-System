<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face Recognition System Project Notes</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --paper: #ffffff;
      --text: #1f2937;
      --muted: #5b6472;
      --border: #dbe2ea;
      --accent: #0f766e;
      --code-bg: #111827;
      --code-text: #e5e7eb;
      --table-head: #ecfdf5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.72;
    }
    .topbar {
      background: #111827;
      color: white;
      padding: 18px 24px;
      border-bottom: 4px solid var(--accent);
    }
    .topbar-inner, main {
      max-width: 1140px;
      margin: 0 auto;
    }
    .topbar h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.3;
    }
    .topbar p {
      margin: 6px 0 0;
      color: #d1d5db;
      font-size: 15px;
    }
    main {
      margin-top: 28px;
      padding: 0 18px 48px;
    }
    .layout {
      display: block;
    }
    article {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    h1, h2, h3, h4 { line-height: 1.25; color: #111827; }
    h1 {
      font-size: 34px;
      margin-top: 0;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    h2 { margin-top: 34px; font-size: 25px; }
    h3 { margin-top: 26px; font-size: 20px; }
    h4 { margin-top: 22px; font-size: 17px; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 18px 0;
      display: block;
      overflow-x: auto;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }
    th { background: var(--table-head); font-weight: 700; }
    code {
      background: #eef2f7;
      border-radius: 4px;
      padding: 2px 5px;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 0.95em;
    }
    pre {
      background: var(--code-bg);
      color: var(--code-text);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
    }
    pre code { background: transparent; color: inherit; padding: 0; }
    blockquote {
      border-left: 4px solid var(--accent);
      margin: 16px 0;
      padding: 8px 16px;
      background: #ecfdf5;
      color: var(--muted);
    }
    hr { border: 0; border-top: 1px solid var(--border); margin: 28px 0; }
    .viewer-heading, .loading, .error { color: var(--muted); font-size: 16px; }
    .error { color: #b91c1c; }
    @media (max-width: 760px) {
      article { padding: 18px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>Face Recognition System Project - OpenCV & Machine Learning Notes</h1>
      <p>Simple Hinglish classroom notes with topic explanation, project build steps, practical code, attendance system, and line-by-line explanation</p>
    </div>
  </header>
  <main>
    <div class="layout">
      <article id="content">
        <p class="loading">Loading project notes...</p>
      </article>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const content = document.getElementById("content");
    const documentTitle = "Face Recognition System Project Notes";
    const documentFile = "face_recognition_system_notes.md";
    marked.setOptions({ gfm: true, breaks: false });
    function loadDocument() {
      content.innerHTML = `<p class="loading">Loading ${documentTitle}...</p>`;
      fetch(documentFile)
        .then((response) => {
          if (!response.ok) throw new Error("Notes file could not be loaded.");
          return response.text();
        })
        .then((markdown) => {
          content.innerHTML = `<p class="viewer-heading">Opened document: ${documentTitle}</p>${marked.parse(markdown)}`;
        })
        .catch((error) => {
          content.innerHTML = `<h1>Document could not be loaded</h1><p class="error">${error.message}</p>`;
        });
    }
    loadDocument();
  </script>
</body>
</html>
